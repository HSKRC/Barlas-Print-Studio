<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Get a Quote | Barlas Print Studio</title><link rel="stylesheet" href="assets/styles.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><span class="mark">B</span>Barlas <small>PRINT STUDIO</small></a><nav class="links"><a href="index.html">Home</a><a href="services.html">Products</a><a href="account.html">Account</a></nav></div></header><section class="pagehero"><div class="container"><h1>Get a Quote</h1><p>Tell us what you need and we will review the job.</p></div></section><main class="section"><div class="container"><form id="quoteForm" class="panel"><div class="formgrid"><div class="field"><label>Full name</label><input name="full_name" required></div><div class="field"><label>Email</label><input type="email" name="email" required></div><div class="field"><label>Phone</label><input name="phone"></div><div class="field"><label>Product</label><select name="product" required><option value="flyer">Flyer</option><option value="brochure">Brochure</option><option value="card">Business Card</option><option value="apparel">T-Shirt / Hoodie</option><option value="mug">Mug / Gift</option><option value="banner">Banner / Signage</option></select></div><div class="field"><label>Quantity</label><input type="number" name="quantity" min="1" required></div><div class="field"><label>Size</label><input name="size" placeholder="A4, A3, 90x55mm, etc."></div><div class="field"><label>Paper / Material</label><input name="paper"></div><div class="field"><label>Print sides</label><select name="print_sides"><option value="single">Single-sided</option><option value="double">Double-sided</option></select></div><div class="field"><label>Finish</label><input name="finish" value="standard"></div><div class="field"><label>Design service?</label><select name="design_service"><option value="no">No</option><option value="yes">Yes</option></select></div></div><div class="field"><label>Notes</label><textarea name="notes" rows="5"></textarea></div><button class="btn dark">Submit Quote Request</button><div id="quoteMsg" class="notice" style="margin-top:16px">Your request will be stored securely.</div></form></div></main><script src="assets/config.js"></script><script type="module" src="assets/app.js"></script></body></html>
