<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Manual Invoices | Barlas Print Studio</title><link rel="stylesheet" href="assets/styles.css"><style>main{max-width:950px;margin:35px auto;padding:18px}.invoice-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.invoice-form label{display:grid;gap:5px;font-weight:600}.invoice-form input,.invoice-form textarea,.invoice-form select{padding:12px;border:1px solid #aaa;border-radius:6px;width:100%;box-sizing:border-box}.wide{grid-column:1/-1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}button{padding:12px 18px;cursor:pointer}.entry{border:1px solid #ddd;padding:12px;margin:8px 0;border-radius:8px}@media(max-width:600px){.invoice-form{grid-template-columns:1fr}}</style></head><body><header class="header"><div class="container nav"><a class="brand" href="admin.html">Barlas Print Studio</a><nav class="links"><a href="admin.html">Admin Dashboard</a></nav></div></header><main><h1>Manual Invoices & Payments</h1><p>Record walk-in jobs, payments and balances. Print or save a PDF copy.</p><div id="notice" class="notice">Checking administrator access…</div><section id="workspace" hidden><form id="form" class="invoice-form"><label>Customer name<input name="customer_name" required></label><label>Customer email<input name="customer_email" type="email" required></label><label class="wide">Job / service description<textarea name="description" rows="3" required placeholder="One Way Vision printing and installation"></textarea></label><label>Quantity<input name="quantity" type="number" min=".01" step=".01" value="1" required></label><label>Unit price (AUD)<input name="unit_price" type="number" min="0" step=".01" required></label><label>Amount received (AUD)<input name="amount_received" type="number" min="0" step=".01" value="0" required></label><label>Payment method<select name="payment_method"><option>Cash</option><option>Bank transfer</option><option>Card</option><option>Other</option></select></label><label class="wide">Notes<textarea name="notes" rows="2"></textarea></label><div class="wide"><strong id="totals">Total $0.00 · Balance $0.00</strong></div><button type="submit">Save Invoice</button></form><h2>Saved Invoices</h2><div id="records"></div></section></main><script src="assets/config.js"></script><script type="module" src="assets/manual-invoices.js"></script></body></html>
